# Identificadores del proyecto
sonar.projectKey=Henry_Quispe_t1
sonar.sources=.

# Servidor de SonarQube
sonar.host.url=https://sonarqube.ingsoftware.lat/
sonar.token=sqa_4e296de25b56b315988b9a9dfd137d2b4f97e7c3

# Exclusiones (ignorar carpetas generadas o de librerias)
sonar.exclusions=node_modules/**, backend/target/**, frontend/dist/**, frontend/build/**, .venv/**, old/**, **/*.py

# Configuracion especifica para Java (OBLIGATORIO para escanear Spring Boot)
sonar.java.binaries=backend/target/classes

# Configuracion de pruebas
sonar.tests=.
sonar.test.inclusions=**/src/test/**, **/*.test.js, **/*.test.jsx

# Reporte de cobertura JaCoCo (generado por: ./mvnw verify)
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Reporte de cobertura Frontend (generado por Vitest)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusiones de Codigo Duplicado (Ignorar POJOs y Entities que son identicos por diseño)
sonar.cpd.exclusions=backend/src/main/java/com/restaurant/rewards/domain/*.java, backend/src/main/java/com/restaurant/rewards/infrastructure/persistence/entity/*.java

# Exclusiones de Cobertura para Clases de Infraestructura que requieren Integracion (Kafka/Base de Datos)
sonar.coverage.exclusions=backend/src/main/java/com/restaurant/rewards/infrastructure/messaging/**, backend/src/main/java/com/restaurant/rewards/infrastructure/persistence/adapter/**, backend/src/main/java/com/restaurant/rewards/infrastructure/persistence/entity/**, backend/src/main/java/com/restaurant/rewards/RewardsApplication.java, frontend/src/main.jsx, frontend/src/App.jsx, frontend/src/setupTests.js
